services:
  db:
    image: postgres:16
    container_name: novostinyaaa_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - novostinya_network
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-U", "docker_app" ]
      interval: 5s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: novostinyaaa_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - CRAWLER_TG_API_ID=${CRAWLER_TG_API_ID}
      - CRAWLER_TG_API_HASH=${CRAWLER_TG_API_HASH}
      - CRAWLER_TG_SESSION_NAME=${CRAWLER_TG_SESSION_NAME}
    ports:
      - "8000:8000"
    volumes:
      - ./apps:/app/apps
      - ./shared:/app/shared
    networks:
      - novostinya_network
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  airflow-init:
    image: apache/airflow:2.8.0
    container_name: novostinyaaa_airflow_init
    depends_on:
      db:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow_data/dags:/opt/airflow/dags
      - ./airflow_data/logs:/opt/airflow/logs
      - ./airflow_data/plugins:/opt/airflow/plugins
      - ./apps:/opt/airflow/apps
      - ./shared:/opt/airflow/shared
    networks:
      - novostinya_network
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com 2>/dev/null || echo "User already exists"
    restart: "no"

  airflow-webserver:
    image: apache/airflow:2.8.0
    container_name: novostinyaaa_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_FERNET_KEY}
    volumes:
      - ./airflow_data/dags:/opt/airflow/dags
      - ./airflow_data/logs:/opt/airflow/logs
      - ./airflow_data/plugins:/opt/airflow/plugins
      - ./apps:/opt/airflow/apps
      - ./shared:/opt/airflow/shared
    ports:
      - "8080:8080"
    networks:
      - novostinya_network
    command: webserver
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    image: apache/airflow:2.8.0
    container_name: novostinyaaa_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow_data/dags:/opt/airflow/dags
      - ./airflow_data/logs:/opt/airflow/logs
      - ./airflow_data/plugins:/opt/airflow/plugins
      - ./apps:/opt/airflow/apps
      - ./shared:/opt/airflow/shared
    networks:
      - novostinya_network
    command: scheduler
    restart: always

volumes:
  postgres_data:

networks:
  novostinya_network:
    driver: bridge